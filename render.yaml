services:
  - type: web
    name: skillsbuild-coach
    runtime: static
    staticPublishPath: ./public
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /version.json
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
